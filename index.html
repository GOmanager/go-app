<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>GO!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: radial-gradient(circle at center, #2e1035 0%, #050206 100%);
      color: #fff;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    .fullscreen-trigger { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: transparent; border: none; cursor: pointer; z-index: 100; }
    .go-logo { font-family: "Comic Sans MS", "Marker Felt", sans-serif; font-size: 25vw; font-weight: bold; color: #39ff14; text-shadow: 0 0 15px rgba(57, 255, 20, 0.6), 0 0 30px rgba(57, 255, 20, 0.4); user-select: none; }
    @media (min-width: 768px) { .go-logo { font-size: 18vw; } }
    .listening .go-logo { animation: neonPulse 1.5s infinite ease-in-out; }
    @keyframes neonPulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <div id="go-text" class="go-logo">GO!</div>
  <button id="goButton" class="fullscreen-trigger" onclick="spustitNahrávání()"></button>

    <script>
    let mediaRecorder;
    let audioChunks = [];

    function spustitNahrávání() {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
          document.body.classList.add('listening');
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };

          mediaRecorder.onstop = () => {
            document.body.classList.remove('listening');
            const audioBlob = new Blob(audioChunks, { type: 'audio/m4a' });
            
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              const base64AudioData = reader.result.split(',');

              // !!! TADY VLOŽTE SVOJI URL ADRESU GOOGLE SCRIPTU (/exec) !!!
              const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgBPt25SQMyJNl8BivMQvuuUZJQRS_R5k19kF9FHtrKv20hxTSU0jQ2uvOp-LfVf-sTA/exec";

              fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: base64AudioData })
              .then(res => res.json())
              .then(data => {
                if (data && data.audio) {
                  // Přehrajeme hotový audio soubor od Gemini z cloudu
                  const audioUrl = "data:audio/mp3;base64," + data.audio;
                  const snd = new Audio(audioUrl);
                  
                  // Jakmile robot domluví, Safari dynamic odpálí hardware příkaz
                  snd.onended = () => { 
                    if (data.typ === "hardware" && data.akce) {
                      // UNIVERZÁLNÍ SYSTÉMOVÝ SKOK: Safari samo otevře Mapy, Hovory, Poznámky nebo Kalendář
                      let dynamicUrl = data.akce + encodeURIComponent(data.hodnota);
                      
                      // Ošetření pro telefonní hovory (nesmí mít zakódované znaky)
                      if (data.akce === "tel:") {
                        dynamicUrl = data.akce + data.hodnota.replace(/\s+/g, '');
                      }

                      window.top.location.href = dynamicUrl;
                      completion();
                    } else {
                      // Pokud šlo o pouhý pokec, automaticky po domluvení otevře mikrofon znovu!
                      setTimeout(() => { spustitNahrávání(); }, 300);
                    }
                  };
                  snd.play();
                }
              }).catch(() => { completion(); });
            };
          };

          mediaRecorder.start();
          setTimeout(() => { if(mediaRecorder.state === "recording") mediaRecorder.stop(); }, 6000);
        }).catch(() => { completion(); });
    }
  </script>
</body>
</html>
