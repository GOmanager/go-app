<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>GO!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <script src="https://twilio.com"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;
      background: radial-gradient(circle at center, #2e1035 0%, #050206 100%); color: #fff; text-align: center; overflow: hidden;
    }
    .go-logo { font-family: "Comic Sans MS", sans-serif; font-size: 25vw; font-weight: bold; color: #39ff14; text-shadow: 0 0 15px rgba(57, 255, 20, 0.6); user-select: none; }
    .talking { animation: neonPulse 1s infinite ease-in-out; color: #00ffff; text-shadow: 0 0 15px rgba(0, 255, 255, 0.6); }
    @keyframes neonPulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

  <div id="go-text" class="go-logo">GO!</div>

  <script>
    let device;
    const RENDER_TOKEN_URL = "https://" + "go-ai-brain." + "onrender." + "com/" + "api/" + "twilio-token";

    async function startLiveCall() {
      const logo = document.getElementById('go-text');
      logo.innerText = "VOLÁM...";
      logo.classList.add('talking');

      try {
        // 1. Vyžádáme si od Renderu anonymní přístupový token pro mezinárodní internetový hovor
        const res = await fetch(RENDER_TOKEN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ stripe_customer_id: "anonymous_device" })
        });
        const data = await res.json();

        // 2. Inicializujeme internetový hovor přes Twilio Voice SDK
        device = new Twilio.Device(data.token, { edge: 'frankfurt', closeProtection: true });
        
        device.on('ready', () => {
          // Okamžitě otevíráme živou linku do cloudu bez mačkání tlačítek
          device.connect();
        });

        device.on('connect', (connection) => {
          logo.innerText = "GO!";
        });

        device.on('disconnect', () => {
          logo.innerText = "KONEC";
          logo.classList.remove('talking');
          // Po zavěšení se okno automaticky zavře a uživatel je zpět na ploše iPhonu
          setTimeout(() => { window.close(); }, 1000);
        });

      } catch (err) {
        logo.innerText = "CHYBA SPOJENÍ";
      }
    }

    // BEZDOTYKOVÝ START: Jakmile Zkratka vystřelí PWA na celou obrazovku, ihned se otevírá audio tunel
    window.onload = () => {
      setTimeout(startLiveCall, 500);
    };
  </script>
</body>
</html>
